name: One-time pinned temporal source identity audit
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/temporalio/temporal.git
      upstream_sha: 98925be15707693868c3a900a5d41df126da7fdf
      audit_slug: temporal
